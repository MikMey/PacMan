[project]
name = "pac-man"
version = "0.1.0"
description = "Recreation of the arcade game Pac-Man"
readme = "README.md"
authors = [{ name = "ldreger" }, { name = "mimeyer" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic",
    "pygame>=2.6.1",
    "rich>=15.0.0",
    "mazegenerator",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pac_man"
module-root = "src"
source-include = ["data/**"]

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }

[project.scripts]
pac-man = "pac_man:main"
